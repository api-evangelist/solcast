    - name: pv-power-sites
      path: /resources/pv_power_sites
      description: List all registered PV power sites for the authenticated account.
      operations:
      - name: list-pv-power-sites
        method: GET
        description: List all registered Solcast PV power sites.
        inputParameters:
        - name: format
          in: query
