capability:
  name: Solar Resource Assessment
  slug: solar-resource-assessment
  description: >-
    Provides historical solar irradiance, PV power, and Typical Meteorological Year (TMY)
    datasets for bankable solar resource assessments. Historical data spans from 2007-01-01
    to 7 days before present in up to 31-day chunks. TMY data is calculated from 2007–2023
    satellite observations and delivers long-run average solar and weather profiles for
    feasibility studies, energy yield assessments, and project financing.
  version: "1.0.0"
  created: "2026-06-13"
  modified: "2026-06-13"
  provider:
    name: Solcast
    url: https://solcast.com
    docs: https://docs.solcast.com.au/

endpoints:
  - operationId: getHistoricRadiationAndWeather
    path: /data/historic/radiation_and_weather
    method: GET
    summary: Get Historic Radiation and Weather
    description: Historical irradiance and weather data from 2007-01-01 up to 7 days before present.

  - operationId: getHistoricRooftopPvPower
    path: /data/historic/rooftop_pv_power
    method: GET
    summary: Get Historic Rooftop PV Power
    description: Historical rooftop PV power estimates without site registration.

  - operationId: getHistoricAdvancedPvPower
    path: /data/historic/advanced_pv_power
    method: GET
    summary: Get Historic Advanced PV Power
    description: Historical high-specification PV power for registered sites.

  - operationId: getHistoricSoilingKimber
    path: /data/historic/soiling/kimber
    method: GET
    summary: Get Historic Soiling (Kimber Model)
    description: Historical panel soiling loss estimates using the Kimber model.

  - operationId: getHistoricSoilingHsu
    path: /data/historic/soiling/hsu
    method: GET
    summary: Get Historic Soiling (HSU Model)
    description: Historical panel soiling loss estimates using Solcast's HSU model.

  - operationId: getTmyRadiationAndWeather
    path: /data/tmy/radiation_and_weather
    method: GET
    summary: Get TMY Radiation and Weather
    description: Typical Meteorological Year irradiance and weather data (2007–2023).

  - operationId: getTmyRooftopPvPower
    path: /data/tmy/rooftop_pv_power
    method: GET
    summary: Get TMY Rooftop PV Power
    description: Typical Meteorological Year rooftop PV power estimates (2007–2023).

parameters:
  - name: latitude
    description: Latitude in decimal degrees (-90 to 90, north positive).
    type: number
    required: true

  - name: longitude
    description: Longitude in decimal degrees (-180 to 180, east positive).
    type: number
    required: true

  - name: start
    description: Start of requested historical period (ISO 8601 date or datetime).
    type: string
    required: true (historic endpoints)

  - name: end
    description: End of requested period (mutually exclusive with duration).
    type: string
    required: false

  - name: duration
    description: ISO 8601 duration within 31 days of start (mutually exclusive with end).
    type: string
    required: false

  - name: output_parameters
    description: Comma-separated list of output fields (e.g., ghi,dni,dhi,air_temp).
    type: string
    required: false

  - name: period
    description: Data interval as ISO 8601 duration (PT5M, PT30M, PT60M).
    type: string
    required: false

  - name: format
    description: Response format — json or csv.
    type: string
    required: false

outputs:
  - name: estimated_actuals
    description: Historical time series of irradiance, weather, or PV power values.

use_cases:
  - name: Solar Resource Assessment
    description: >-
      Project developers use historical and TMY data for bankable resource assessment
      in project financing, including P50 and P90 energy yield calculations.

  - name: Performance Analysis
    description: >-
      Asset managers compare historical modelled production against measured output
      to detect degradation, shading, or soiling issues.

  - name: Soiling Analysis
    description: >-
      Historical soiling estimates are used to quantify annual yield losses and
      optimise panel cleaning schedules.

  - name: Energy Yield Assessment
    description: >-
      TMY data underpins long-term energy yield assessments (P50/P90) required by
      lenders and equity investors in solar project financing.

tags:
  - Historical Data
  - TMY
  - Resource Assessment
  - Solar Irradiance
  - PV Power
  - Renewable Energy
  - Project Finance
