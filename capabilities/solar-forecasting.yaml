capability:
  name: Solar Forecasting
  slug: solar-forecasting
  description: >-
    Delivers satellite-derived solar irradiance and PV power forecasts up to 14 days
    ahead with 5- to 60-minute temporal resolution, covering Global Horizontal Irradiance
    (GHI), Direct Normal Irradiance (DNI), Diffuse Horizontal Irradiance (DHI), rooftop
    PV power, and advanced PV power for registered sites. Forecasts combine high-resolution
    satellite nowcasting (approx. 4 hours ahead) with numerical weather model guidance
    beyond that horizon.
  version: "1.0.0"
  created: "2026-06-13"
  modified: "2026-06-13"
  provider:
    name: Solcast
    url: https://solcast.com
    docs: https://docs.solcast.com.au/

endpoints:
  - operationId: getForecastRadiationAndWeather
    path: /data/forecast/radiation_and_weather
    method: GET
    summary: Get Forecast Radiation and Weather
    description: Solar irradiance and weather forecasts up to 14 days ahead for any global location.

  - operationId: getForecastRooftopPvPower
    path: /data/forecast/rooftop_pv_power
    method: GET
    summary: Get Forecast Rooftop PV Power
    description: Rooftop PV power forecasts up to 14 days ahead without site registration.

  - operationId: getForecastAdvancedPvPower
    path: /data/forecast/advanced_pv_power
    method: GET
    summary: Get Forecast Advanced PV Power
    description: High-specification PV power forecasts for registered sites up to 14 days ahead.

  - operationId: getForecastSoilingKimber
    path: /data/forecast/soiling/kimber
    method: GET
    summary: Get Forecast Soiling (Kimber Model)
    description: Hourly soiling loss forecasts using the pvlib Kimber model.

  - operationId: getForecastSoilingHsu
    path: /data/forecast/soiling/hsu
    method: GET
    summary: Get Forecast Soiling (HSU Model)
    description: Hourly soiling loss forecasts using Solcast's HSU model.

  - operationId: getForecastAggregations
    path: /data/forecast/aggregations
    method: GET
    summary: Get Forecast Aggregations
    description: Forecast aggregated PV generation for grid collections up to 7 days ahead.

  - operationId: getLiveRadiationAndWeather
    path: /data/live/radiation_and_weather
    method: GET
    summary: Get Live Radiation and Weather
    description: Real-time satellite-derived solar irradiance and weather updated every 5 minutes.

  - operationId: getLiveRooftopPvPower
    path: /data/live/rooftop_pv_power
    method: GET
    summary: Get Live Rooftop PV Power
    description: Real-time rooftop PV power estimated actuals without site registration.

  - operationId: getLiveAdvancedPvPower
    path: /data/live/advanced_pv_power
    method: GET
    summary: Get Live Advanced PV Power
    description: Real-time advanced PV power estimated actuals for registered sites.

parameters:
  - name: latitude
    description: Latitude in decimal degrees (-90 to 90, north positive).
    type: number
    required: true

  - name: longitude
    description: Longitude in decimal degrees (-180 to 180, east positive).
    type: number
    required: true

  - name: output_parameters
    description: Comma-separated list of output fields (e.g., ghi,dni,dhi,air_temp).
    type: string
    required: varies

  - name: hours
    description: Number of forecast hours to retrieve (up to 336 for 14 days).
    type: integer
    required: false

  - name: period
    description: Data interval as ISO 8601 duration (PT5M, PT30M, PT60M).
    type: string
    required: false

  - name: format
    description: Response format — json or csv.
    type: string
    required: false

outputs:
  - name: estimated_actuals
    description: Time series of near-real-time or historical estimated actual values.

  - name: forecasts
    description: Time series of future forecast values.

tags:
  - Solar Forecasting
  - Irradiance
  - PV Power
  - Renewable Energy
  - Energy Market
  - Grid Management
