        - name: end
          in: query
          type: string
          required: false
          description: End of requested period (mutually exclusive with duration).
        - name: duration
          in: query
          type: string
          required: false
          description: ISO 8601 duration within 31 days (mutually exclusive with end).
        - name: output_parameters
