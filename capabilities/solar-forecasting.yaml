naftiko: 1.0.0-alpha2
info:
  label: Solcast Solar Forecasting
  description: Workflow capability for solar energy forecasting and real-time monitoring. Combines live and forecast radiation,
    PV power, soiling, and grid aggregation data to support energy market bidding, dispatch optimization, and grid management.
    Used by energy traders, grid operators, and renewable energy portfolio managers.
  tags:
  - Solar
  - Forecasting
  - PV Power
  - Grid Management
  - Energy Market
  - Renewable Energy
  - Live Data
  - Aggregations
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SOLCAST_API_KEY: SOLCAST_API_KEY
capability:
  consumes:
  - type: http
    namespace: solcast
    baseUri: https://api.solcast.com.au
    description: Solcast solar irradiance, PV power, weather forecasting, and site management API.
    authentication:
      type: bearer
      token: '{{SOLCAST_API_KEY}}'
    resources:
    - name: live-radiation-and-weather
      path: /data/live/radiation_and_weather
      description: Real-time satellite-derived solar irradiance and weather data for a location (last 7 days, updated every
        5 minutes).
      operations:
      - name: get-live-radiation-and-weather
        method: GET
        description: Get live irradiance and weather estimated actuals for a lat/lon location.
        inputParameters:
        - name: latitude
          in: query
          type: number
          required: true
          description: Latitude in decimal degrees (-90 to 90, north positive).
        - name: longitude
          in: query
          type: number
          required: true
          description: Longitude in decimal degrees (-180 to 180, east positive).
        - name: output_parameters
          in: query
          type: string
          required: true
          description: Comma-separated output parameters (e.g., ghi,dni,dhi,air_temp).
        - name: period
          in: query
          type: string
          required: false
          description: Time period between data points (ISO 8601, e.g., PT30M).
        - name: format
          in: query
          type: string
          required: false
          description: 'Response format: json or csv.'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: live-rooftop-pv-power
      path: /data/live/rooftop_pv_power
      description: Live rooftop PV power estimated actuals by location without site registration.
      operations:
      - name: get-live-rooftop-pv-power
        method: GET
        description: Get live rooftop PV power estimated actuals for a lat/lon location.
        inputParameters:
        - name: latitude
          in: query
          type: number
          required: true
          description: Latitude in decimal degrees.
        - name: longitude
          in: query
          type: number
          required: true
          description: Longitude in decimal degrees.
        - name: capacity
          in: query
          type: number
          required: false
          description: System capacity in kilowatts.
        - name: tilt
          in: query
          type: number
          required: false
          description: Panel tilt angle in degrees.
        - name: azimuth
          in: query
          type: number
          required: false
          description: Panel azimuth in degrees.
        - name: period
          in: query
          type: string
          required: false
          description: Time period between data points (ISO 8601).
        - name: format
          in: query
          type: string
          required: false
          description: 'Response format: json or csv.'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: live-advanced-pv-power
      path: /data/live/advanced_pv_power
      description: Live high-specification PV power actuals for a registered PV site.
      operations:
      - name: get-live-advanced-pv-power
        method: GET
        description: Get live advanced PV power actuals for a registered PV power site.
        inputParameters:
        - name: resource_id
          in: query
          type: string
          required: true
          description: Unique identifier for a registered Solcast PV power site.
        - name: period
          in: query
          type: string
          required: false
          description: Time period between data points (ISO 8601).
        - name: format
          in: query
          type: string
          required: false
          description: 'Response format: json or csv.'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: live-soiling-kimber
      path: /data/live/soiling/kimber
      description: Live hourly soiling loss estimates using the Kimber model.
      operations:
      - name: get-live-soiling-kimber
        method: GET
        description: Get live soiling loss estimates for a location using the Kimber model.
        inputParameters:
        - name: latitude
          in: query
          type: number
          required: true
          description: Latitude in decimal degrees.
        - name: longitude
          in: query
          type: number
          required: true
          description: Longitude in decimal degrees.
        - name: depo_veloc_pm10
          in: query
          type: number
          required: false
          description: Deposition velocity for PM10 particles (m/s).
        - name: initial_soiling
          in: query
          type: number
          required: false
          description: Initial soiling fraction (0.0 = clean).
        - name: format
          in: query
          type: string
          required: false
          description: 'Response format: json or csv.'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: live-soiling-hsu
      path: /data/live/soiling/hsu
      description: Live hourly soiling loss estimates using Solcast's HSU model.
      operations:
      - name: get-live-soiling-hsu
