        - name: pv-power-sites
          path: /resources/pv_power_sites
          description: "List all registered PV power sites for the authenticated account."
          operations:
            - name: list-pv-power-sites
              method: GET
              description: "List all registered Solcast PV power sites."
              inputParameters:
                - name: format
                  in: query
                  type: string
                  required: false
                  description: "Response format: json or csv."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: pv-power-site
          path: /resources/pv_power_site
          description: "CRUD management of individual registered PV power sites."
          operations:
            - name: get-pv-power-site
              method: GET
              description: "Get specifications and metadata for a specific registered PV power site."
              inputParameters:
                - name: resource_id
                  in: query
                  type: string
                  required: true
                  description: "Unique identifier for the PV power site."
                - name: format
                  in: query
                  type: string
                  required: false
                  description: "Response format: json or csv."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-pv-power-site
              method: POST
              description: "Create a new PV power site for use with the advanced PV power model."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  latitude: "{{tools.latitude}}"
                  longitude: "{{tools.longitude}}"
                  capacity: "{{tools.capacity}}"
                  tilt: "{{tools.tilt}}"
                  azimuth: "{{tools.azimuth}}"

            - name: patch-pv-power-site
              method: PATCH
              description: "Partially update specifications of an existing PV power site."
              inputParameters:
                - name: resource_id
                  in: query
                  type: string
                  required: true
                  description: "Unique identifier for the PV power site to update."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  capacity: "{{tools.capacity}}"

            - name: update-pv-power-site
              method: PUT
              description: "Fully overwrite specifications of an existing PV power site."
              inputParameters:
                - name: resource_id
                  in: query
                  type: string
                  required: true
                  description: "Unique identifier for the PV power site to overwrite."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  latitude: "{{tools.latitude}}"
                  longitude: "{{tools.longitude}}"
                  capacity: "{{tools.capacity}}"

            - name: delete-pv-power-site
              method: DELETE
              description: "Permanently delete a registered PV power site."
              inputParameters:
                - name: resource_id
                  in: query
                  type: string
                  required: true
                  description: "Unique identifier for the PV power site to delete."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: solcast-api
