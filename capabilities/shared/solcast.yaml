          description: "Real-time irradiance and weather data."
          operations:
            - method: GET
              name: get-live-radiation-and-weather
              description: "Get live radiation and weather for a location."
              call: "solcast.get-live-radiation-and-weather"
              with:
                latitude: "rest.latitude"
                longitude: "rest.longitude"
                output_parameters: "rest.output_parameters"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/live/rooftop-pv-power
          name: live-rooftop-pv-power
          description: "Live rooftop PV power data."
          operations:
            - method: GET
              name: get-live-rooftop-pv-power
              description: "Get live rooftop PV power for a location."
              call: "solcast.get-live-rooftop-pv-power"
              with:
                latitude: "rest.latitude"
                longitude: "rest.longitude"
              outputParameters:
                - type: object
                  mapping: "$."

