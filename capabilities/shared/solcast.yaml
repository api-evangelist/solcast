                - name: longitude
                  in: query
                  type: number
                  required: true
                  description: "Longitude in decimal degrees."
                - name: start
                  in: query
                  type: string
                  required: true
                  description: "Start of requested period (ISO 8601 date or datetime)."
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End of requested period (mutually exclusive with duration)."
                - name: duration
                  in: query
                  type: string
                  required: false
                  description: "ISO 8601 duration within 31 days (mutually exclusive with end)."
                - name: output_parameters
                  in: query
                  type: string
                  required: false
                  description: "Comma-separated output parameters."
                - name: period
                  in: query
                  type: string
                  required: false
                  description: "Time period between data points (ISO 8601)."
                - name: format
                  in: query
