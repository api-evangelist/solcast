          schema:
            type: number
            format: float
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
          example: 151.215297
        - name: start
          in: query
          required: true
          description: Start of requested period (ISO 8601 date or datetime).
          schema:
            type: string
          example: '2023-01-01'
        - name: end
          in: query
          required: false
          description: End of requested period (mutually exclusive with duration).
          schema:
            type: string
          example: '2023-01-31'
        - name: duration
          in: query
          required: false
          description: ISO 8601 duration within 31 days of start (mutually exclusive with end).
          schema:
            type: string
          example: P7D
        - name: capacity
          in: query
          required: false
          description: System capacity in kilowatts.
          schema:
            type: number
            format: float
