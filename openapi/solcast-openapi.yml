openapi: 3.1.0
info:
  title: Solcast API
  description: >-
    The Solcast API provides live, forecast, historical, and typical meteorological
    year (TMY) solar irradiance, PV power, and weather data derived from a global fleet
    of weather satellites. Data covers rooftop PV, advanced PV, grid aggregations, and
    soiling loss models (Kimber and HSU) globally. Solcast is part of DNV's Green Data
    Products suite. Authentication uses an API key passed via the Authorization header.
  version: 1.0.0
  contact:
    name: Solcast Support
    url: https://solcast.com/contact
  license:
    name: Commercial
    url: https://solcast.com/terms-of-service
  x-logo:
    url: https://solcast.com/wp-content/uploads/2021/01/Solcast-Logo.svg
servers:
  - url: https://api.solcast.com.au
    description: Solcast Production API
security:
  - apiKeyAuth: []
tags:
  - name: Live Data
    description: Real-time solar irradiance, PV power, and weather estimated actuals (last 7 days, updated every 5 minutes).
  - name: Forecast Data
    description: Solar irradiance, PV power, and weather forecasts up to 14 days ahead.
  - name: Historic Data
    description: Historical solar radiation and weather data from 2007-01-01 up to 7 days before present.
  - name: TMY Data
    description: Typical Meteorological Year data computed from 2007 to 2023 satellite observations.
  - name: Aggregations
    description: Live and forecast aggregated generation data for grid collections and sub-aggregations.
  - name: PV Power Sites
    description: CRUD management of registered PV power sites for use with the advanced PV power model.
paths:
  /data/live/radiation_and_weather:
    get:
      operationId: getLiveRadiationAndWeather
      summary: Get Live Radiation and Weather
      description: >-
        Get irradiance and weather estimated actuals for near real-time and the past
        7 days for the requested location, derived from satellite (clouds and irradiance
        over non-polar continental areas) and numerical weather models (other data).
        Data is updated every 5 minutes.
      tags:
        - Live Data
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, between -90 and 90 (north positive).
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: 151.215297
        - name: output_parameters
          in: query
          required: true
          description: >-
            Comma-separated list of output parameters to return (e.g., ghi,dni,dhi,air_temp,
            wind_speed_10m,cloud_opacity,clearsky_ghi).
          schema:
            type: string
          example: ghi,dni,dhi,air_temp,wind_speed_10m
        - name: period
          in: query
          required: false
          description: >-
            Time period between data points in ISO 8601 duration format
            (e.g., PT5M for 5 minutes, PT30M for 30 minutes, PT60M for 60 minutes).
          schema:
            type: string
          example: PT30M
        - name: format
          in: query
          required: false
          description: Response format. Defaults to json.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with irradiance and weather time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiationAndWeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/live/rooftop_pv_power:
    get:
      operationId: getLiveRooftopPvPower
      summary: Get Live Rooftop PV Power
      description: >-
        Get basic rooftop PV power estimated actuals for the present time up to
        7 days of past data for the requested location. Data is derived from satellite
        observations and numerical weather models. No site registration required.
      tags:
        - Live Data
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, between -90 and 90 (north positive).
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: 151.215297
        - name: capacity
          in: query
          required: false
          description: System capacity in kilowatts.
          schema:
            type: number
            format: float
          example: 5.0
        - name: tilt
          in: query
          required: false
          description: Panel tilt angle in degrees from horizontal (0 = flat, 90 = vertical).
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 90
          example: 25
        - name: azimuth
          in: query
          required: false
          description: Panel azimuth in degrees (0/360 = north, 90 = east, 180 = south, 270 = west).
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 360
          example: 180
        - name: output_parameters
          in: query
          required: false
          description: Comma-separated list of output parameters (e.g., pv_power_rooftop,pv_estimate).
          schema:
            type: string
          example: pv_power_rooftop
        - name: period
          in: query
          required: false
          description: Time period between data points in ISO 8601 duration format.
          schema:
            type: string
          example: PT30M
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with rooftop PV power time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvPowerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/live/advanced_pv_power:
    get:
      operationId: getLiveAdvancedPvPower
      summary: Get Live Advanced PV Power
      description: >-
        Get high-specification PV power estimated actuals for the present time
        up to 7 days of past data for a registered PV power site. Uses Solcast's
        advanced PV model. Requires a resource_id from a registered site.
      tags:
        - Live Data
      parameters:
        - name: resource_id
          in: query
          required: true
          description: Unique resource identifier for a registered Solcast PV power site.
          schema:
            type: string
          example: ba75-e17a-7374-95ed
        - name: output_parameters
          in: query
          required: false
          description: Comma-separated list of output parameters.
          schema:
            type: string
          example: pv_power_advanced
        - name: period
          in: query
          required: false
          description: Time period between data points in ISO 8601 duration format.
          schema:
            type: string
          example: PT30M
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with advanced PV power time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PvPowerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/live/soiling/kimber:
    get:
      operationId: getLiveSoilingKimber
      summary: Get Live Soiling (Kimber Model)
      description: >-
        Get hourly live soiling loss estimates using the Kimber model. Returns a
        time series of estimated cumulative soiling or cleanliness state for the
        requested location based on pvlib's Kimber soiling model.
      tags:
        - Live Data
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, between -90 and 90 (north positive).
          schema:
            type: number
            format: float
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
          example: 151.215297
        - name: depo_veloc_pm10
          in: query
          required: false
          description: Deposition velocity for PM10 particles (m/s).
          schema:
            type: number
            format: float
        - name: initial_soiling
          in: query
          required: false
          description: Initial soiling fraction (0.0 = clean, 1.0 = fully soiled).
          schema:
            type: number
            format: float
          example: 0.0
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with soiling time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/live/soiling/hsu:
