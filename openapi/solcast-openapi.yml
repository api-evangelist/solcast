  /data/forecast/aggregations:
    get:
      operationId: getForecastAggregations
      summary: Get Forecast Aggregations
      description: >-
        Get forecast aggregation data for up to 7 days ahead for a requested grid
        collection or sub-aggregation. Used for portfolio and grid management.
      tags:
        - Aggregations
      parameters:
        - name: collection_id
          in: query
          required: true
          description: Unique identifier for the grid aggregation collection.
          schema:
            type: string
        - name: aggregation_id
          in: query
          required: false
          description: Unique identifier for a specific sub-aggregation within the collection.
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: Time period between data points in ISO 8601 duration format.
