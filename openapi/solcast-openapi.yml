          schema:
            type: number
            format: float
        - name: initial_soiling
          in: query
          required: false
          description: Initial soiling fraction (0.0 = clean, 1.0 = fully soiled).
          schema:
            type: number
            format: float
          example: 0.0
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with soiling time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/forecast/radiation_and_weather:
    get:
      operationId: getForecastRadiationAndWeather
      summary: Get Forecast Radiation and Weather
      description: >-
        Get irradiance and weather forecasts from the present time up to 14 days
        ahead for the requested location, derived from satellite observations
        (nowcasted for approx. 4 hours ahead) and numerical weather models.
        Data is available at 5- to 60-minute granularity.
      tags:
        - Forecast Data
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, between -90 and 90 (north positive).
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: 151.215297
        - name: output_parameters
          in: query
          required: true
          description: >-
            Comma-separated list of output parameters to return (e.g., ghi,dni,dhi,
            air_temp,wind_speed_10m,cloud_opacity,clearsky_ghi).
          schema:
            type: string
          example: ghi,dni,dhi,air_temp
        - name: hours
          in: query
          required: false
          description: Number of forecast hours to retrieve (up to 336 for 14 days).
          schema:
            type: integer
            minimum: 1
            maximum: 336
          example: 48
        - name: period
          in: query
          required: false
          description: Time period between data points in ISO 8601 duration format.
          schema:
            type: string
          example: PT30M
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with forecast irradiance and weather time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiationAndWeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
