          schema:
            type: number
            format: float
          example: 5.0
        - name: tilt
          in: query
          required: false
          description: Panel tilt angle in degrees from horizontal.
          schema:
            type: number
            format: float
          example: 25
        - name: azimuth
          in: query
          required: false
          description: Panel azimuth in degrees.
          schema:
            type: number
            format: float
          example: 180
        - name: output_parameters
          in: query
          required: true
          description: Comma-separated list of output parameters.
          schema:
            type: string
          example: pv_power_rooftop
        - name: hours
          in: query
          required: false
          description: Number of forecast hours to retrieve (up to 336).
          schema:
            type: integer
          example: 48
        - name: period
          in: query
          required: false
