  /data/historic/radiation_and_weather:
    get:
      operationId: getHistoricRadiationAndWeather
      summary: Get Historic Radiation and Weather
      description: >-
        Get historical irradiance and weather estimated actuals for up to 31 days of
        data at a time for a requested location. Data is available from 2007-01-01T00:00Z
        up to 7 days before present.
      tags:
        - Historic Data
      parameters:
        - name: latitude
          in: query
          required: true
          description: Latitude in decimal degrees, between -90 and 90 (north positive).
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
          example: -33.856784
        - name: longitude
          in: query
          required: true
          description: Longitude in decimal degrees, between -180 and 180 (east positive).
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
          example: 151.215297
        - name: start
          in: query
          required: true
          description: Start of requested period (ISO 8601 date or datetime, e.g., 2023-01-01 or 2023-01-01T00:00Z).
          schema:
            type: string
          example: '2023-01-01'
        - name: end
          in: query
          required: false
          description: End of requested period (mutually exclusive with duration).
          schema:
            type: string
          example: '2023-01-31'
        - name: duration
          in: query
          required: false
          description: >-
            ISO 8601 duration for the historic data, within 31 days of start
            (mutually exclusive with end). E.g., P7D for 7 days.
          schema:
            type: string
          example: P7D
        - name: output_parameters
          in: query
          required: false
          description: Comma-separated list of output parameters.
          schema:
            type: string
          example: ghi,dni,dhi,air_temp
        - name: period
          in: query
          required: false
          description: Time period between data points in ISO 8601 duration format.
          schema:
            type: string
          example: PT60M
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
          example: json
      responses:
        '200':
          description: Successful response with historic irradiance and weather time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadiationAndWeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /data/historic/rooftop_pv_power:
    get:
